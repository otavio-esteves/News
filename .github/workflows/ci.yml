name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match container user to runner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build and start
        run: make setup
      - name: PHP style
        run: make lint
      - name: Tests
        run: make test
      - name: Stop services
        if: always()
        run: docker compose down
